<svg xmlns="http://www.w3.org/2000/svg" width="720" height="523" viewBox="0 0 720 523" role="img" aria-label="Throughput by routing strategy: chain bottlenecks, spread and capped use the whole pool">
  <defs><linearGradient id="g0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7b72"/><stop offset="1" stop-color="#f85149"/></linearGradient><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#56d364"/><stop offset="1" stop-color="#3fb950"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#56d364"/><stop offset="1" stop-color="#3fb950"/></linearGradient></defs>
  <rect width="720" height="523" fill="#0d1117"/>
  <text x="360" y="38" fill="#e6edf3" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" text-anchor="middle">Strict failover wastes the pool. Load-aware routing uses all of it.</text>
  <rect x="64.2" y="56" width="591.6" height="38" rx="19" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="82.2" y="76.0" fill="#e6edf3" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" dominant-baseline="middle">3 endpoints</text><circle cx="191.6" cy="76.0" r="3" fill="#58a6ff"/><text x="208.6" y="76.0" fill="#e6edf3" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" dominant-baseline="middle">cap 40 @ 50ms</text><circle cx="334.8" cy="76.0" r="3" fill="#58a6ff"/><text x="351.8" y="76.0" fill="#e6edf3" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" dominant-baseline="middle">600 reqs @ conc 200</text><circle cx="528.4" cy="76.0" r="3" fill="#58a6ff"/><text x="545.4" y="76.0" fill="#e6edf3" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" dominant-baseline="middle">median of 3</text>
  <line x1="64" y1="378.0" x2="692.0" y2="378.0" stroke="#21262d" stroke-width="1"/><text x="54.0" y="382.0" fill="#6e7681" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="end">0</text><line x1="64" y1="315.5" x2="692.0" y2="315.5" stroke="#21262d" stroke-width="1"/><text x="54.0" y="319.5" fill="#6e7681" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="end">648</text><line x1="64" y1="253.0" x2="692.0" y2="253.0" stroke="#21262d" stroke-width="1"/><text x="54.0" y="257.0" fill="#6e7681" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="end">1296</text><line x1="64" y1="190.5" x2="692.0" y2="190.5" stroke="#21262d" stroke-width="1"/><text x="54.0" y="194.5" fill="#6e7681" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="end">1944</text><line x1="64" y1="128.0" x2="692.0" y2="128.0" stroke="#21262d" stroke-width="1"/><text x="54.0" y="132.0" fill="#6e7681" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="end">2592</text>
  <line x1="64" y1="300.8" x2="692.0" y2="300.8" stroke="#8b949e" stroke-width="1" stroke-dasharray="5 4" opacity="0.7"/><text x="692.0" y="295.8" fill="#8b949e" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="end">1-endpoint ceiling 800</text><line x1="64" y1="146.5" x2="692.0" y2="146.5" stroke="#8b949e" stroke-width="1" stroke-dasharray="5 4" opacity="0.7"/><text x="692.0" y="141.5" fill="#8b949e" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="end">full-pool ceiling 2400</text>
  <rect x="120.7" y="303.7" width="96.0" height="74.3" rx="7" fill="url(#g0)"/><text x="168.7" y="277.7" fill="#e6edf3" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" text-anchor="middle">770.7</text><text x="168.7" y="293.7" fill="#8b949e" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle">req/s · p50 259ms</text><text x="168.7" y="404" fill="#e6edf3" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">chain</text><text x="168.7" y="421" fill="#8b949e" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">rides one endpoint; the rest of the pool is idle</text><rect x="330.0" y="192.9" width="96.0" height="185.1" rx="7" fill="url(#g1)"/><text x="378.0" y="166.9" fill="#e6edf3" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" text-anchor="middle">1919.1</text><text x="378.0" y="182.9" fill="#8b949e" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle">req/s · p50 103ms</text><text x="378.0" y="404" fill="#e6edf3" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">spread</text><text x="378.0" y="421" fill="#8b949e" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">fills every peer evenly</text><rect x="539.3" y="218.8" width="96.0" height="159.2" rx="7" fill="url(#g2)"/><text x="587.3" y="192.8" fill="#e6edf3" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" text-anchor="middle">1650.1</text><text x="587.3" y="208.8" fill="#8b949e" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle">req/s · p50 52ms</text><text x="587.3" y="404" fill="#e6edf3" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">capped</text><text x="587.3" y="421" fill="#8b949e" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">rides the primary to its cap, then spills</text>
  <text x="360.0" y="451.0" fill="#8b949e" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle">Deterministic in-process A/B: 3 endpoints, each serving 40 at a time at 50ms; excess queues. Strict</text>
  <text x="360.0" y="467.0" fill="#8b949e" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle">chain pins at the single-endpoint ceiling (800 req/s) with the rest of the pool idle; load-aware</text>
  <text x="360.0" y="483.0" fill="#8b949e" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle">routing uses the whole pool. Whiskers are min–max over 3 runs (tight = deterministic). Lab</text>
  <text x="360.0" y="499.0" fill="#8b949e" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle">benchmark; field results on free public RPCs are noisier. 2026-06-19 19:28:32 UTC.</text>
</svg>
