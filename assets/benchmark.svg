<svg xmlns="http://www.w3.org/2000/svg" width="720" height="543" viewBox="0 0 720 543" role="img" aria-label="Success rate and throughput climb as providers are added to the pool">
  <defs><linearGradient id="g0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7b72"/><stop offset="1" stop-color="#f85149"/></linearGradient><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#56d364"/><stop offset="1" stop-color="#3fb950"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#56d364"/><stop offset="1" stop-color="#3fb950"/></linearGradient><linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#56d364"/><stop offset="1" stop-color="#3fb950"/></linearGradient><linearGradient id="g4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#56d364"/><stop offset="1" stop-color="#3fb950"/></linearGradient></defs>
  <rect width="720" height="543" fill="#0d1117"/>
  <text x="360" y="40" fill="#e6edf3" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="800" text-anchor="middle">One provider buckles, a pool holds</text>
  <rect x="39.9" y="60" width="640.2" height="40" rx="20" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="57.9" y="81.0" fill="#e6edf3" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" dominant-baseline="middle">1000 requests</text><circle cx="195.8" cy="81.0" r="3" fill="#58a6ff"/><text x="212.8" y="81.0" fill="#e6edf3" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" dominant-baseline="middle">concurrency 250</text><circle cx="369.3" cy="81.0" r="3" fill="#58a6ff"/><text x="386.3" y="81.0" fill="#e6edf3" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" dominant-baseline="middle">chain base</text><circle cx="496.3" cy="81.0" r="3" fill="#58a6ff"/><text x="513.3" y="81.0" fill="#e6edf3" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" dominant-baseline="middle">free public RPCs</text>
  <line x1="62" y1="366.0" x2="692.0" y2="366.0" stroke="#21262d" stroke-width="1"/><text x="50.0" y="370.0" fill="#6e7681" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="end">0%</text><line x1="62" y1="308.5" x2="692.0" y2="308.5" stroke="#21262d" stroke-width="1"/><text x="50.0" y="312.5" fill="#6e7681" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="end">25%</text><line x1="62" y1="251.0" x2="692.0" y2="251.0" stroke="#21262d" stroke-width="1"/><text x="50.0" y="255.0" fill="#6e7681" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="end">50%</text><line x1="62" y1="193.5" x2="692.0" y2="193.5" stroke="#21262d" stroke-width="1"/><text x="50.0" y="197.5" fill="#6e7681" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="end">75%</text><line x1="62" y1="136.0" x2="692.0" y2="136.0" stroke="#21262d" stroke-width="1"/><text x="50.0" y="140.0" fill="#6e7681" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="end">100%</text>
  <rect x="89.7" y="329.4" width="70.6" height="36.6" rx="7" fill="url(#g0)"/><text x="125.0" y="317.4" fill="#e6edf3" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" text-anchor="middle">15.9%</text><rect x="215.7" y="136.0" width="70.6" height="230.0" rx="7" fill="url(#g1)"/><text x="251.0" y="124.0" fill="#e6edf3" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" text-anchor="middle">100.0%</text><rect x="341.7" y="166.6" width="70.6" height="199.4" rx="7" fill="url(#g2)"/><text x="377.0" y="154.6" fill="#e6edf3" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" text-anchor="middle">86.7%</text><rect x="467.7" y="141.5" width="70.6" height="224.5" rx="7" fill="url(#g3)"/><text x="503.0" y="129.5" fill="#e6edf3" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" text-anchor="middle">97.6%</text><rect x="593.7" y="136.5" width="70.6" height="229.5" rx="7" fill="url(#g4)"/><text x="629.0" y="124.5" fill="#e6edf3" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" text-anchor="middle">99.8%</text>
  <text x="125.0" y="394" fill="#e6edf3" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">1 provider</text><text x="125.0" y="412" fill="#8b949e" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle">224 req/s</text><text x="251.0" y="394" fill="#e6edf3" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">2 providers</text><text x="251.0" y="412" fill="#8b949e" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle">1384.7 req/s</text><text x="377.0" y="394" fill="#e6edf3" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">3 providers</text><text x="377.0" y="412" fill="#8b949e" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle">203.1 req/s</text><text x="503.0" y="394" fill="#e6edf3" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">4 providers</text><text x="503.0" y="412" fill="#8b949e" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle">274.9 req/s</text><text x="629.0" y="394" fill="#e6edf3" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">5 providers</text><text x="629.0" y="412" fill="#8b949e" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle">690.5 req/s</text>
  <text x="360.0" y="442.0" fill="#8b949e" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">We fire 1000 requests at concurrency 250 (250 in flight at once). req/s is successful calls per</text>
  <text x="360.0" y="459.0" fill="#8b949e" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">second sustained over the burst, not a request count. Single-runner, real-network field data.</text>
  <text x="360.0" y="492.0" fill="#6e7681" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">Bars = success rate, sub-labels = sustained req/s, per provider count. At this load a pool of 2 already</text>
  <text x="360.0" y="507.0" fill="#6e7681" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">absorbs the burst; heavier bursts need more providers. Auto-generated 2026-06-18 00:16:07 UTC. Real-network,</text>
  <text x="360.0" y="522.0" fill="#6e7681" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">varies with live public-RPC conditions.</text>
</svg>
