[package]
name = "drm3-rpc-pool"
version = "0.2.1"
edition = "2021"
description = "Resilient JSON-RPC failover pool for any EVM chain. Unbounded ordered endpoint list, per-endpoint health + backoff, capability routing, first-success-wins dispatch."
license = "MIT"
repository = "https://github.com/DRM3Labs-OSS/drm3-rpc-pool"
keywords = ["evm", "rpc", "ethereum", "failover", "drm3"]
categories = ["api-bindings", "network-programming"]
authors = ["DRM3 Labs Corp. <support@drm3.io>", "Robert Christian (@robertjchristian)"]

[lib]
name = "drm3_rpc_pool"
path = "src/lib.rs"

[[bin]]
name = "drm3-rpc-pool"
path = "src/main.rs"
required-features = ["daemon"]

[features]
default = ["reqwest-transport", "daemon"]
# Bundled HTTP transport using reqwest. Off -> caller supplies Transport impl.
# Pulls in tokio because the reqwest path and `call_with_timeout` rely on it.
reqwest-transport = ["reqwest", "dep:tokio"]
# The language-agnostic proxy daemon (HTTP server + CLI). Pulls in axum + clap.
daemon = ["reqwest-transport", "axum", "clap", "tracing-subscriber", "tokio/full"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
thiserror = "2"
tracing = "0.1"
# tokio is only needed by the native reqwest transport / daemon. wasm consumers
# build with `default-features = false` and never pull it in.
tokio = { version = "1", features = ["sync", "time", "rt", "macros"], optional = true }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false, optional = true }
async-trait = "0.1"
parking_lot = "0.12"
# Drop-in `Instant`/`SystemTime` that works on both native and wasm32. On native
# it re-exports `std::time`; on wasm it uses the browser `performance.now()`.
web-time = "1"
# Daemon-only dependencies.
axum = { version = "0.8", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
http-body-util = "0.1"
proptest = "1"
futures = "0.3"
