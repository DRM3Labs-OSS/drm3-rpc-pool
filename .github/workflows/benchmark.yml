# Throughput benchmark — auto-generated, real-network results.
#
# Runs the `throughput` example as a POOL-SIZE SWEEP and writes the result into
# the README "Results" section plus a multi-bar SVG chart in
# assets/benchmark.svg, then commits both back as github-actions[bot].
#
# IMPORTANT: each pool size runs in its OWN job so it lands on its OWN runner
# (its own egress IP). Public RPCs are IP-rate-limited, so running every size
# from one IP would let them squash each other's limits and ruin the comparison.
# Pool size N uses `--mode pool --pool-size N` (the first N preset endpoints);
# size 1 is the single-endpoint control with no failover. The `publish` job
# concatenates every size's JSON line into one sweep file and renders it.
#
# These are honest field numbers against FREE public endpoints (no key). They
# vary with live public-RPC conditions and are timestamped. Adding a keyed
# provider raises the ceiling well past these defaults.
name: Benchmark

on:
  workflow_dispatch:
    inputs:
      chain:
        description: "Chain preset to benchmark"
        default: "base"
      requests:
        description: "Total requests per pool size"
        default: "600"
      concurrency:
        description: "Concurrent in-flight requests"
        default: "120"
      max_pool:
        description: "Largest pool size to sweep (number of endpoints)"
        default: "5"
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  run:
    name: pool size ${{ matrix.size }} (own runner / own IP)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Sweep pool sizes 1..5 (base preset has 5 endpoints). Each size on its
        # own runner so it gets its own IP and rate-limit budget. If you raise
        # max_pool above a preset's endpoint count the example clamps to it.
        size: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run throughput (pool size ${{ matrix.size }})
        run: |
          cargo run --release --example throughput -- \
            --mode pool \
            --pool-size "${{ matrix.size }}" \
            --chain "${{ github.event.inputs.chain || 'base' }}" \
            --requests "${{ github.event.inputs.requests || '600' }}" \
            --concurrency "${{ github.event.inputs.concurrency || '120' }}" \
            | tee result-${{ matrix.size }}.json

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.size }}
          path: result-${{ matrix.size }}.json

  publish:
    name: chart + README
    needs: run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all sweep results
        uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results
          merge-multiple: true

      - name: Concatenate into one sweep file
        run: cat results/result-*.json > sweep.jsonl

      - name: Generate chart + README block
        run: node .github/scripts/render-benchmark.mjs sweep.jsonl

      - name: Commit results back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- README.md assets/benchmark.svg; then
            echo "no benchmark changes"
            exit 0
          fi
          git add README.md assets/benchmark.svg
          git commit -m "bench: refresh throughput sweep (auto, real-network)"
          git push
