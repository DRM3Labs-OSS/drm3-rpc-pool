# Throughput benchmark — controlled, deterministic routing A/B.
#
# Runs the `throughput` example in `--mock` mode: a fully in-process A/B of the
# three routing strategies (chain / spread / capped) against synthetic
# endpoints with a fixed latency and concurrency limit. There is no network, so
# the result is deterministic and isolates the routing mechanism from
# public-RPC noise. The job writes the result into the README "Results" section
# plus a bar-chart SVG in assets/benchmark.svg, then commits both back as
# github-actions[bot].
#
# Why controlled instead of field data: real free public RPCs are dominated by
# which endpoint happens to be healthy in the moment, so a field A/B of routing
# strategies is swamped by noise (run to run it can say anything). The mock
# isolates the one variable that matters here — how the pool routes a burst.
# The example can still be pointed at real endpoints (drop `--mock`) for honest,
# noisy field numbers; that just is not what this chart claims.
name: Benchmark

on:
  workflow_dispatch:
    inputs:
      endpoints:
        description: "Synthetic endpoints in the pool"
        default: "3"
      capacity:
        description: "Per-endpoint concurrency (requests served at once)"
        default: "40"
      latency_ms:
        description: "Per-request latency (ms)"
        default: "50"
      requests:
        description: "Total requests per burst"
        default: "600"
      concurrency:
        description: "Concurrent in-flight requests"
        default: "200"
      runs:
        description: "Bursts per route — median + min/max band"
        default: "3"
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  bench:
    name: controlled routing A/B + chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run controlled routing A/B (chain / spread / capped)
        env:
          ENDPOINTS: ${{ github.event.inputs.endpoints || '3' }}
          CAPACITY: ${{ github.event.inputs.capacity || '40' }}
          LATENCY: ${{ github.event.inputs.latency_ms || '50' }}
          REQUESTS: ${{ github.event.inputs.requests || '600' }}
          CONCURRENCY: ${{ github.event.inputs.concurrency || '200' }}
          RUNS: ${{ github.event.inputs.runs || '3' }}
        run: |
          : > results.jsonl
          for route in chain spread capped; do
            cargo run --release --example throughput -- \
              --mock \
              --mock-endpoints "$ENDPOINTS" \
              --mock-capacity "$CAPACITY" \
              --mock-latency-ms "$LATENCY" \
              --route "$route" \
              --cap "$CAPACITY" \
              --runs "$RUNS" \
              --requests "$REQUESTS" \
              --concurrency "$CONCURRENCY" \
              | tee -a results.jsonl
          done

      - name: Generate chart + README block
        run: node .github/scripts/render-benchmark.mjs results.jsonl

      - name: Commit results back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- README.md assets/benchmark.svg; then
            echo "no benchmark changes"
            exit 0
          fi
          git add README.md assets/benchmark.svg
          git commit -m "bench: refresh controlled routing A/B (auto, deterministic)"
          git push
