name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: test
        run: |
          set +e            # capture the result so the report is written even on failure
          cargo test --all-features --no-fail-fast 2>&1 | tee test-output.txt
          code=${PIPESTATUS[0]}
          {
            echo "## Test report"
            echo '```'
            grep -E "Running|test result:|Doc-tests" test-output.txt || true
            echo '```'
            passed=$(grep -oE "[0-9]+ passed" test-output.txt | awk '{s+=$1} END{print s+0}')
            failed=$(grep -oE "[0-9]+ failed" test-output.txt | awk '{s+=$1} END{print s+0}')
            echo "**${passed} passed, ${failed} failed** across $(grep -c 'test result:' test-output.txt) suites."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
