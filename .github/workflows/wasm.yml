name: WASM

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  # Build check: every push/PR confirms the wasm binding still compiles to
  # wasm32 and that wasm-pack emits the .js + .d.ts + .wasm package.
  build:
    name: wasm-pack build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/wasm

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build (web target)
        run: wasm-pack build bindings/wasm --target web

      - name: Build (bundler target)
        run: wasm-pack build bindings/wasm --target bundler --out-dir pkg-bundler

      - name: Verify generated artifacts
        run: |
          test -f bindings/wasm/pkg/drm3_rpc_pool_wasm.js
          test -f bindings/wasm/pkg/drm3_rpc_pool_wasm.d.ts
          test -f bindings/wasm/pkg/drm3_rpc_pool_wasm_bg.wasm
          echo "wasm pkg OK"

  # NOTE: npm publishing lives in release.yml (the single canonical publisher,
  # alongside the binary + crates.io release). This workflow is build/verify
  # ONLY. A duplicate "dormant" publish job used to live here; it was removed
  # because it raced release.yml on every tag and the loser failed with
  # "cannot publish over the existing version."
